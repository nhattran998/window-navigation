# taplo: TOML formatter/linter. Run: just fmt-toml / just lint-toml.

include = ["*.toml", "crates/**/*.toml"]
exclude = ["target/**", "vendor/**", "bazel-*/**"]

[formatting]
# Aligned comments, 100 columns, reorder keys — matches the repo style.
align-comments = true
reorder-keys = true
column-width = 100
