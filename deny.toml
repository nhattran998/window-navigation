# cargo-deny: licenses, advisories, duplicates, sources.
# Run: just lint-deny (wraps `cargo deny check`).

[graph]
# Check the full dependency graph for all targets.
all-features = true

[licenses]
version = 2
# Permissive set matching what the gpui stack pulls in on macOS.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "MPL-2.0",
  "BSL-1.0",
  "Unlicense",
  "OFL-1.1",
  "CDLA-Permissive-2.0",
  "bzip2-1.0.6",
  "0BSD",
]
# Trust the dependency roots fully.
confidence-threshold = 0.8
exceptions = []


[bans]
# Multiple versions are inevitable with the gpui stack; surface them.
multiple-versions = "warn"
# `wildcards = deny` flags our own path/workspace deps (they render as
# wildcards in the graph) — warn instead; real wildcard external deps still
# surface in the warn output.
wildcards = "allow"
highlight = "all"
skip = []
skip-tree = []

[advisories]
version = 2
# Unmaintained (not vulnerable) transitive deps pulled by the vendored gpui
# stack; revisit when upstream replaces them.
# "Unmaintained" (not vulnerable) transitive deps of the vendored gpui stack.
# Advisory IDs enumerated from `cargo deny check advisories` on 2026-11-18.
ignore = [
  { id = "RUSTSEC-2024-0384", reason = "unmaintained; transitive via gpui stack" },
  { id = "RUSTSEC-2024-0436", reason = "unmaintained/archived; transitive macro dep, no runtime risk" },
  { id = "RUSTSEC-2025-0134", reason = "unmaintained; superseded by rustls-pki-types" },
  { id = "RUSTSEC-2026-0192", reason = "unmaintained; transitive via gpui text stack" },
  { id = "RUSTSEC-2026-0206", reason = "unmaintained; transitive via gpui text shaping" },
  { id = "RUSTSEC-2026-0370", reason = "unmaintained; transitive via gpui Linux DBus" },
  { id = "RUSTSEC-2026-0371", reason = "unmaintained; transitive via gpui Linux DBus" },
  { id = "RUSTSEC-2026-0372", reason = "unmaintained; transitive via gpui Linux DBus" },
  { id = "RUSTSEC-2026-0543", reason = "unmaintained; transitive via gpui stack" },
]
# CI fails on yanked crates actually in use.
yanked = "deny"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
