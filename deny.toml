# cargo-deny: licenses, advisories, duplicates, sources.
# Run: just lint-deny (wraps `cargo deny check`).

[graph]
# Check the full dependency graph for all targets.
all-features = true

[licenses]
version = "2"
# Permissive set matching what the gpui stack pulls in on macOS.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "MPL-2.0",
  "BSL-1.0",
  "Unlicense",
  "OFL-1.1",
  "CDLA-Permissive-2.0",
  "bzip2-1.0.6",
]
# Trust the dependency roots fully.
confidence-threshold = 0.8
exceptions = []


[bans]
# Multiple versions are inevitable with the gpui stack; surface them.
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
# Known duplicates we accept until upstream aligns.
skip = []
skip-tree = []

[advisories]
version = "2"
ignore = []
# CI fails on yanked crates actually in use.
yanked = "deny"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
