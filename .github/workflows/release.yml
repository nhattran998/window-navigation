# Publish a GitHub release from a v* tag. ci.yml must be green on the tag.
#
# Changelog body comes from CHANGELOG.md (git-cliff, regenerated by
# `just changelog` in scripts/release/release.sh).
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  extract-notes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      notes: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Pull this version's section out of CHANGELOG.md.
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" {flag=1; next}
            /^## \[/ && flag {exit}
            flag {print}
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section for $GITHUB_REF_NAME" >&2
            exit 1
          fi
          {
            echo "body<<EOF"
            cat release-notes.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  artifacts:
    strategy:
      fail-fast: false
      matrix:
        include:
          # CLI + app are macOS-only until the v1.1 (Windows) / v1.2 (Linux)
          # backends land (PRD OOS-4). Add matrix rows per platform as they
          # ship, e.g. { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, cli: true }.
          - { os: macos-15, target: aarch64-apple-darwin, cli: true, app: true }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # secrets context is not available in steps.if; mirror it via env.
      APPLE_ID: ${{ secrets.APPLE_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: build wnav CLI
        if: matrix.cli
        run: cargo build --release --locked -p wnav --target ${{ matrix.target }}
      - name: build wnav-app (macOS)
        if: matrix.app
        run: cargo build --release --locked -p wnav-app --target ${{ matrix.target }}
      - name: bundle wnav-app (macOS, default — no signing)
        if: matrix.app && env.APPLE_ID == ''
        env:
          CERT_B64: ${{ secrets.MACOS_CERTIFICATE_B64 }}
        run: |
          brew install librsvg
          if [ -n "$CERT_B64" ]; then
            echo "$CERT_B64" | base64 --decode > cert.p12
            echo "CERT_PATH=$PWD/cert.p12" >> "$GITHUB_ENV"
          fi
          version="${GITHUB_REF_NAME#v}"
          bash scripts/release/bundle-macos.sh \
            "target/${{ matrix.target }}/release/wnav-app" "$version" dist-bundle
      - name: bundle + sign + notarize wnav-app (macOS)
        if: matrix.app && env.APPLE_ID != ''
        env:
          CERT_B64: ${{ secrets.MACOS_CERTIFICATE_B64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_NOTARY_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          brew install librsvg
          echo "$CERT_B64" | base64 --decode > cert.p12
          echo "CERT_PATH=$PWD/cert.p12" >> "$GITHUB_ENV"
          version="${GITHUB_REF_NAME#v}"
          bash scripts/release/bundle-macos.sh \
            "target/${{ matrix.target }}/release/wnav-app" "$version" dist-bundle sign
      - name: stage artifacts
        shell: bash
        run: |
          dir="wnav-${GITHUB_REF_NAME#v}-${{ matrix.target }}"
          mkdir -p "$dir"
          if [ "${{ matrix.cli }}" = "true" ]; then
            cp "target/${{ matrix.target }}/release/wnav"[.exe] "$dir/" 2>/dev/null || \
              cp "target/${{ matrix.target }}/release/wnav" "$dir/" || \
              cp "target/${{ matrix.target }}/release/wnav.exe" "$dir/"
          fi
          if [ "${{ matrix.app }}" = "true" ]; then
            cp dist-bundle/*.dmg "$dir/"
          fi
          tar czf "$dir.tar.gz" "$dir"
          echo "ARTIFACT=$dir.tar.gz" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error

  publish:
    needs: [extract-notes, artifacts]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v5
        with:
          merge-multiple: true
          path: dist
      - name: checksums
        run: cd dist && shasum -a 256 * > checksums-sha256.txt
      - uses: softprops/action-gh-release@v2
        with:
          body: ${{ needs.extract-notes.outputs.notes }}
          files: dist/*
