# Publish a GitHub release from a v* tag. ci.yml must be green on the tag.
#
# Changelog body comes from CHANGELOG.md (git-cliff, regenerated by
# `just changelog` in scripts/release/release.sh).
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  extract-notes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      notes: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Pull this version's section out of CHANGELOG.md.
          awk -v ver="[$version]" '
            $0 ~ "^## \\[" ver "\\]" {flag=1; next}
            /^## \[/ && flag {exit}
            flag {print}
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section for $GITHUB_REF_NAME" >&2
            exit 1
          fi
          {
            echo "body<<EOF"
            cat release-notes.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  artifacts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin, wnav: true, app: true }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, wnav: true }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, wnav: true }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: build wnav CLI
        run: cargo build --release --locked -p wnav --target ${{ matrix.target }}
      - name: build wnav-app (macOS)
        if: matrix.app
        run: cargo build --release --locked -p wnav-app --target ${{ matrix.target }}
      - name: stage artifacts
        shell: bash
        run: |
          dir="wnav-${GITHUB_REF_NAME#v}-${{ matrix.target }}"
          mkdir -p "$dir"
          cp "target/${{ matrix.target }}/release/wnav"[.exe] "$dir/" 2>/dev/null || \
            cp "target/${{ matrix.target }}/release/wnav" "$dir/" || \
            cp "target/${{ matrix.target }}/release/wnav.exe" "$dir/"
          if [ "${{ matrix.app }}" = "true" ]; then
            cp "target/${{ matrix.target }}/release/wnav-app" "$dir/"
          fi
          tar czf "$dir.tar.gz" "$dir"
          echo "ARTIFACT=$dir.tar.gz" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error

  publish:
    needs: [extract-notes, artifacts]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v5
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          body: ${{ needs.extract-notes.outputs.notes }}
          files: dist/*
