<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Wnav icon: a window snapped into a grid position.
    Rounded-square app tile (macOS squircle proportions), four window panes
    with the active one emphasized. Monochrome by design — platform builds
    can tint the tile via their own pipeline.
  -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="#1c1c1e"/>
  <!-- faint full-size window outline -->
  <rect x="96" y="112" width="320" height="288" rx="24" fill="none" stroke="#5a5a5e" stroke-width="12"/>
  <!-- active snapped window: left half, emphasized -->
  <rect x="112" y="128" width="140" height="256" rx="14" fill="#0a84ff"/>
  <!-- other half: dimmed placeholder -->
  <rect x="264" y="128" width="136" height="256" rx="14" fill="#48484a"/>
  <!-- arrows hinting snap direction -->
  <path d="M 332 256 h 40 m 0 0 l -14 -14 m 14 14 l -14 14" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
