<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 320" width="1024" height="320">
  <!--
    macOS DMG background, 1x. Export a 2x PNG (2048x640) for retina
    distribution; see distribution notes in brand/macos/README.md.
    Left zone: icon drop target. Right zone: Applications alias.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1d1f"/>
      <stop offset="1" stop-color="#101012"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a84ff"/>
      <stop offset="1" stop-color="#0055d4"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="320" rx="24" fill="url(#bg)" stroke="#3a3a3c" stroke-width="2"/>

  <!-- icon drop zone (left) -->
  <g transform="translate(140 60)">
    <rect x="0" y="0" width="200" height="200" rx="46" fill="none" stroke="#48484a" stroke-width="6" stroke-dasharray="16 14"/>
    <rect x="40" y="50" width="120" height="100" rx="10" fill="url(#accent)"/>
    <rect x="40" y="50" width="56" height="100" rx="10" fill="#ffffff" opacity="0.9"/>
    <text x="100" y="196" text-anchor="middle" font-family="-apple-system, SF Pro Text, sans-serif" font-size="20" fill="#98989d">Wnav</text>
  </g>

  <!-- arrow between zones -->
  <path d="M 420 160 h 160 m 0 0 l -24 -24 m 24 24 l -24 24" stroke="#5a5a5e" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- applications zone (right) -->
  <g transform="translate(664 60)">
    <rect x="0" y="0" width="200" height="200" rx="46" fill="none" stroke="#48484a" stroke-width="6" stroke-dasharray="16 14"/>
    <g fill="#e5e5ea">
      <rect x="46" y="46" width="48" height="48" rx="10"/>
      <rect x="106" y="46" width="48" height="48" rx="10"/>
      <rect x="46" y="106" width="48" height="48" rx="10"/>
      <rect x="106" y="106" width="48" height="48" rx="10"/>
    </g>
    <text x="100" y="196" text-anchor="middle" font-family="-apple-system, SF Pro Text, sans-serif" font-size="20" fill="#98989d">Applications</text>
  </g>
</svg>
