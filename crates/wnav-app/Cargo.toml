[package]
name = "wnav-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Wnav menu-bar app: hotkeys, menus, preferences (gpui-kit)"
repository.workspace = true
keywords = ["window", "macos", "gui", "shortcuts"]
categories = ["gui", "os"]

[[bin]]
name = "wnav-app"
path = "src/main.rs"

[features]
default = []

[dependencies]
wnav-core = { workspace = true, features = ["schemars"] }
wnav-macos = { workspace = true }
gpui-kit = { workspace = true }
global-hotkey = { workspace = true }
crossbeam-channel = { workspace = true }
toml_edit = { workspace = true }
serde = { workspace = true }
schemars = "1"

[lints]
workspace = true
